<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon | Pawsome & Co. Pet Shop</title>
<meta name="description" content="Pawsome and Co.'s new pet shop experience is launching soon. Subscribe to be the first to know.">
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/images/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/dark-mode.css">
<script>
  (function(){
    var t = localStorage.getItem('pawsome-theme');
    if(!t){ t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<main id="main-content" class="coming-soon-page paw-pattern">
  <div class="container-xl-custom text-center">
    <a class="brand-logo justify-content-center mb-4" href="index.html">
      <span class="paw-badge"><i class="bi bi-paw-fill" aria-hidden="true"></i></span>
      Pawsome<span class="brand-tail">&amp;Co.</span>
    </a>
    <h1>Something New Is Coming</h1>
    <p class="fs-5 mx-auto" style="max-width:560px;">We're building a brand-new pet shop experience with more products, smarter grooming bookings, and faster delivery. Be the first to know when we launch.</p>

    <div class="countdown-grid" data-countdown="2026-11-15T09:00:00">
      <div class="countdown-item">
        <span class="num" data-cd-days>00</span>
        <span class="label">Days</span>
      </div>
      <div class="countdown-item">
        <span class="num" data-cd-hours>00</span>
        <span class="label">Hours</span>
      </div>
      <div class="countdown-item">
        <span class="num" data-cd-mins>00</span>
        <span class="label">Minutes</span>
      </div>
      <div class="countdown-item">
        <span class="num" data-cd-secs>00</span>
        <span class="label">Seconds</span>
      </div>
    </div>

    <form class="newsletter-form d-flex mx-auto" style="background:none;" data-validate-form novalidate>
      <label for="csEmail" class="visually-hidden">Email address</label>
      <input type="email" id="csEmail" name="email" class="form-control" placeholder="Enter your email" required style="border:1px solid var(--border-color);">
      <button type="submit" class="btn btn-primary-pet">
        <span class="spinner-border btn-spinner" role="status" aria-hidden="true"></span>
        <span class="btn-label-text">Notify Me</span>
      </button>
    </form>
    <div class="form-success-msg mt-3 mx-auto" style="max-width:480px; justify-content:center;"><i class="bi bi-check-circle-fill"></i> You're on the list! We'll email you at launch.</div>

    <div class="social-icons justify-content-center mt-4">
      <a href="#" class="btn-icon-circle" aria-label="Pawsome and Co. on Facebook"><i class="bi bi-facebook"></i></a>
      <a href="#" class="btn-icon-circle" aria-label="Pawsome and Co. on Instagram"><i class="bi bi-instagram"></i></a>
      <a href="#" class="btn-icon-circle" aria-label="Pawsome and Co. on Pinterest"><i class="bi bi-pinterest"></i></a>
      <a href="#" class="btn-icon-circle" aria-label="Pawsome and Co. on YouTube"><i class="bi bi-youtube"></i></a>
    </div>

    <button class="theme-toggle-btn mt-4" type="button" aria-pressed="false" aria-label="Switch to dark mode">
      <i class="bi bi-moon-stars icon-moon" aria-hidden="true"></i>
      <i class="bi bi-sun icon-sun" aria-hidden="true"></i>
    </button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>
</body>
</html>
